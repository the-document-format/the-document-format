[[bin]]
name = "tdf-cli"
path = "src/main.rs"

[[bin]]
name = "tdf-interactive"
path = "src/interactive.rs"

[dependencies]
tdf-engine = {path = "../../crates/tdf-engine"}
clap = {version = "4", features = ["derive"]}

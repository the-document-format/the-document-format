[workspace]
resolver = "3"
members = ["crates/*", "scripts/*"]

[workspace.dependencies]
# femtovg 0.23.x depends on wgpu 28.x — keep in sync with tdf-web-viewer
femtovg = {version = "0.23.1", default-features = false, features = [
  "wgpu",
  "textlayout",
  "image-loading"
]}
tdf-engine = {path = "crates/tdf-engine"}

[dependencies]
# Activate JPEG decoding in the `image` crate instance that femtovg pulls in.
# femtovg declares `image` with default-features=false, so without this no
# formats are enabled.
image = {version = "0.25", default-features = false, features = ["jpeg"]}
femtovg.workspace = true
tdf-engine.workspace = true

[package]
name = "tdf-renderer"
version = "0.0.0"
edition = "2021"
